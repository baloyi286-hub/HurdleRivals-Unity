name: Build Hurdle Rivals
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Unity ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: Android
            buildTarget: Android
            buildOutput: Builds/Android/HurdleRivals.apk
            artifactName: HurdleRivals-AndroidTV-APK
          - targetPlatform: StandaloneLinux64
            buildTarget: StandaloneLinux64
            buildOutput: Builds/StandaloneLinux64/HurdleRivals.x86_64
            artifactName: HurdleRivals-Linux-Unity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
      - name: Build Unity player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_TARGET: ${{ matrix.buildTarget }}
          BUILD_OUTPUT: ${{ matrix.buildOutput }}
        with:
          unityVersion: 6000.0.35f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: HurdleRivals.Editor.CIBuilder.Build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.buildOutput }}
          if-no-files-found: error
          retention-days: 14
