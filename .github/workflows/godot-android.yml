name: Godot Android TV APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: '4.4.1'
      GODOT_RELEASE: '4.4.1.stable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot and Android export templates
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_RELEASE}"
          unzip -q templates.tpz
          cp templates/* "$HOME/.local/share/godot/export_templates/${GODOT_RELEASE}/"
          rm -rf templates
      - name: Create debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Hurdle Rivals,C=ZA"
      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.4.tres"
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Import project and check scripts
        run: godot --headless --verbose --path . --editor --import --quit
      - name: Export Android APK
        timeout-minutes: 15
        run: |
          mkdir -p build
          godot --headless --path . --editor --install-android-build-template --quit
          test -f android/build/build.gradle || (echo "Missing Godot Android Gradle template" && exit 1)
          godot --headless --verbose --path . --export-debug Android build/HurdleRivals.apk
          test -s build/HurdleRivals.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HurdleRivals-Godot-AndroidTV-APK
          path: build/HurdleRivals.apk
          if-no-files-found: error
          retention-days: 14
